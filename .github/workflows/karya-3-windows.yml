name: Kārya 3 Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Karya_3.0_Flutter_Source.zip'
      - '.github/workflows/karya-3-windows.yml'
      - 'ci/fix_v3_tap.py'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Restore Kārya 3.0
        shell: pwsh
        run: |
          if (!(Test-Path 'Karya_3.0_Flutter_Source.zip')) { throw 'Upload the new source ZIP first.' }
          Expand-Archive -Path 'Karya_3.0_Flutter_Source.zip' -DestinationPath "$env:RUNNER_TEMP/karya-src" -Force
          Copy-Item -Path "$env:RUNNER_TEMP/karya-src/Karya_3.0_Flutter/*" -Destination . -Recurse -Force
          if (!(Test-Path 'lib/features/constellation.dart')) { throw 'Kārya 3 code not found.' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name=karya_app --no-pub .
      - name: Remove generated Flutter template test and clean warnings
        shell: pwsh
        run: |
          if (Test-Path 'test/widget_test.dart') { Remove-Item 'test/widget_test.dart' -Force }
          @'
          from pathlib import Path
          db = Path('test/database_test.dart')
          text = db.read_text(encoding='utf-8')
          db.write_text(text.replace("import 'package:karya_app/core/models.dart';\n", ""), encoding='utf-8')
          logic = Path('test/logic_test.dart')
          text = logic.read_text(encoding='utf-8')
          text = text.replace("final logs=<String>{'2026-10-21','2026-10-21'};", "final logs=<String>{'2026-10-21'};\n    logs.add('2026-10-21');")
          logic.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Fix immediate button tap response
        run: python ci/fix_v3_tap.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test
      - run: flutter build windows --release
      - name: Zip Windows app
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'Karya_3.0_Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Karya_3.0_Windows_App
          path: Karya_3.0_Windows.zip
          if-no-files-found: error
          retention-days: 14
