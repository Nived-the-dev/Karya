name: Publish Kārya 2.1 readable Flutter source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-source.yml'
permissions:
  contents: write
jobs:
  publish-flutter-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Extract original Flutter project
        shell: bash
        run: |
          if [ -f lib/core/appearance.dart ]; then
            echo "Kārya 2.1 already committed as readable source."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/karya-original"
          unzip -q Karya_2.0_Flutter_Source.zip -d "$RUNNER_TEMP/karya-original"
          test -f "$RUNNER_TEMP/karya-original/Karya_2.0_Flutter/lib/main.dart"
          cp -a "$RUNNER_TEMP/karya-original/Karya_2.0_Flutter"/. .
          python3 ci/upgrade21.py
          python3 ci/repair_flutter.py
          test -f lib/core/appearance.dart
          test -f lib/features/ideas.dart
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate full Android scaffolding
        run: |
          flutter create --platforms=android --project-name=karya_app --no-pub .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          flutter pub get
          dart format lib test integration_test
          flutter analyze --no-fatal-infos
          flutter test test
      - name: Commit readable source to the repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib test integration_test android assets store_assets tool pubspec.yaml README.md FEATURES.md PROJECT_STATUS.md TEST_RESULTS.md PRIVACY_POLICY.html PLAY_STORE_LISTING.md RELEASE_CHECKLIST.md
          if git diff --cached --quiet; then
            echo 'Readable sources already up to date.'
          else
            git commit -m 'Publish validated Kārya 2.1 editable Flutter source'
            git push origin HEAD:main
          fi
