name: Kārya Android build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/promote-source.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Restore Kārya 2.1 source
        shell: bash
        run: |
          if [ -f lib/main.dart ] && [ -f lib/core/appearance.dart ]; then
            echo "Using readable Kārya 2.1 sources from Git."
          else
            echo "Restoring original source and applying verified 2.1 patch."
            mkdir -p "$RUNNER_TEMP/karya-import"
            unzip -q Karya_2.0_Flutter_Source.zip -d "$RUNNER_TEMP/karya-import"
            cp -a "$RUNNER_TEMP/karya-import/Karya_2.0_Flutter"/. .
            python3 ci/upgrade21.py
            python3 ci/repair_flutter.py
          fi
          test -f lib/main.dart
          test -f lib/core/appearance.dart
          test -f lib/features/ideas.dart
          test -f assets/karya_icon.png
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable (Dart 3.12 or later)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check SDK versions
        run: |
          flutter --version
          flutter doctor -v
      - name: Generate missing platform wrapper files without replacing existing configuration
        run: flutter create --platforms=android --project-name=karya_app --no-pub .
      - name: Ensure Android API 36 is installed
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Resolve packages
        run: flutter pub get
      - name: Clean generated Flutter template test
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Apply safe Dart lint fixes
        run: dart fix --apply || true
      - name: Format sources
        run: dart format lib test integration_test
      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter unit and widget tests
        run: flutter test test
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Karya_2.1_Test_APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
