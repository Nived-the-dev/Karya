name: Kārya Android build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Restore Kārya source from latest uploaded ZIP
        shell: bash
        run: |
          if [ -f Karya_2.1_Flutter_Source.zip ]; then
            archive=Karya_2.1_Flutter_Source.zip
          elif [ -f Karya_2.0_Flutter_Source.zip ]; then
            archive=Karya_2.0_Flutter_Source.zip
          else
            echo "::error::Upload Karya_2.1_Flutter_Source.zip to the repository root."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/karya-import"
          unzip -q "$archive" -d "$RUNNER_TEMP/karya-import"
          source_dir="$RUNNER_TEMP/karya-import/Karya_2.0_Flutter"
          test -f "$source_dir/lib/main.dart"
          test -f "$source_dir/pubspec.yaml"
          cp -a "$source_dir"/. .
          test -f lib/main.dart
          test -f assets/karya_icon.png
          echo "Restored $archive"
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable (Dart 3.12 or later)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check SDK versions
        run: |
          flutter --version
          flutter doctor -v
      - name: Generate missing platform wrapper files without replacing existing configuration
        run: flutter create --platforms=android --project-name=karya_app --no-pub .
      - name: Ensure Android API 36 is installed
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Resolve packages
        run: flutter pub get
      - name: Repair legacy code or clean generated template test
        run: |
          if [ -f Karya_2.1_Flutter_Source.zip ]; then
            if [ -f test/widget_test.dart ]; then rm test/widget_test.dart; fi
          else
            python3 ci/repair_flutter.py
          fi
      - name: Apply safe Dart lint fixes
        run: dart fix --apply || true
      - name: Format sources
        run: dart format lib test integration_test
      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter unit and widget tests
        run: flutter test test
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Karya_2.1_Test_APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
