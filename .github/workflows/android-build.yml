name: Kārya Android build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable (Dart 3.12 or later)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check SDK versions
        run: |
          flutter --version
          flutter doctor -v
      - name: Generate missing platform wrapper files without replacing existing configuration
        run: flutter create --platforms=android --project-name=karya_app --no-pub .
      - name: Ensure Android API 36 is installed
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Resolve packages
        run: flutter pub get
      - name: Format sources
        run: dart format lib test integration_test
      - name: Dart static analysis
        run: flutter analyze
      - name: Flutter unit and widget tests
        run: flutter test test
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Karya_2.0_Test_APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
